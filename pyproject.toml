[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "folklore-skills"
version = "0.1.0"
description = "Turn a project's unwritten code-review rules into an Agent Skill, with evidence for every rule."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Folklore contributors" }]
keywords = ["code-review", "agent-skills", "github", "hacktoberfest", "llm", "open-source"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "playwright>=1.40"]

[project.scripts]
folklore = "folklore.cli:main"

[project.urls]
Homepage = "https://github.com/ravirepswal108-lgtm/FlokFlore"
Issues = "https://github.com/ravirepswal108-lgtm/FlokFlore/issues"

[tool.setuptools.packages.find]
include = ["folklore*"]

[tool.setuptools.package-data]
folklore = ["data/*.jsonl", "templates/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
