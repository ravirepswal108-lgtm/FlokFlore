name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Install a browser for the dashboard tests
        run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Pipeline runs end to end on the test fixture
        run: |
          folklore run --comments tests/fixtures/synthetic_comments.jsonl --repo test/fixture \
            --now 2026-10-15 --skills-dir out/skills --report out/report.html
          folklore validate out/skills/fixture-folklore
