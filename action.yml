name: Folklore pre-review
description: >
  Leave a friendly pre-review comment when a pull request breaks a convention that
  maintainers have repeatedly asked for in past reviews.
author: Folklore contributors
branding:
  icon: book-open
  color: orange

inputs:
  github-token:
    description: Token used to read the PR diff and post the comment.
    required: true
  rules:
    description: Path to assets/rules.json, checked out from the BASE branch.
    required: true
  pr:
    description: Pull request number. Defaults to the PR that triggered the workflow.
    required: false
    default: ""
  config:
    description: Path to .folklore.yml (from the base branch).
    required: false
    default: .folklore.yml
  llm-api-key:
    description: Optional key for an OpenAI-compatible endpoint (enables enforce.mode llm).
    required: false
    default: ""
  dry-run:
    description: Print the comment to the log instead of posting it.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install Folklore
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Check the pull request
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        FOLKLORE_API_KEY: ${{ inputs.llm-api-key }}
        FOLKLORE_PR: ${{ inputs.pr || github.event.pull_request.number }}
        FOLKLORE_RULES: ${{ inputs.rules }}
        FOLKLORE_CONFIG: ${{ inputs.config }}
        FOLKLORE_DRY_RUN: ${{ inputs.dry-run }}
        FOLKLORE_REPO: ${{ github.repository }}
      run: |
        args=(--config "$FOLKLORE_CONFIG" check-pr --repo "$FOLKLORE_REPO" --pr "$FOLKLORE_PR" --rules "$FOLKLORE_RULES")
        if [ "$FOLKLORE_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
        folklore "${args[@]}"
